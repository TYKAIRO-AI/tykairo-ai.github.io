<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090c"><title>حالة طلب ADPILOT | TYKAIRO AI</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><style>body{margin:0;background:#09090c;color:#f7f4f5;font:16px/1.9 Cairo,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{max-width:620px;padding:30px;border:1px solid #63303c;border-radius:18px;background:#171217;text-align:center}h1{color:#ff6576}p{color:#c7bac0}a{display:inline-block;margin-top:15px;padding:11px 17px;background:#e32636;border-radius:9px;color:#fff;text-decoration:none}</style></head><body><main class="card"><h1>شكرًا لطلبك</h1><p id="state">بنراجع حالة الدفع التجريبي. لا تعتبر العملية مكتملة إلا بعد تأكيدها من السيرفر.</p><a href="/store/adpilot/">العودة إلى ADPILOT</a></main><script>(()=>{const base=String(window.ADPILOT_LICENSE_API_BASE||"").replace(/\/$/,""),params=new URLSearchParams(location.hash.slice(1)),order=params.get("order"),token=params.get("token"),state=document.getElementById("state");if(!base||!order||!token){state.textContent="لم نتمكن من التحقق من حالة الطلب تلقائيًا. تواصل مع الدعم مع رقم الطلب إن توفر.";return}fetch(base+"/v1/orders/status?order_id="+encodeURIComponent(order),{headers:{Authorization:"Bearer "+token}}).then(r=>r.json()).then(data=>{if(!data.ok)throw new Error();state.textContent=data.status==="paid"||data.status==="delivered"?"تم تأكيد الدفع. فريق TYKAIRO هيتواصل معاك لتسليم مفاتيح الترخيص.":"حالة الطلب: "+data.status+" — انتظر تأكيد الدفع من السيرفر."}).catch(()=>{state.textContent="تعذر جلب حالة الطلب. تواصل مع الدعم."})})();</script></body></html>
