<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TYKAIRO-AI — AI Short-Form Video Workflow</title>
<desc id="desc">Illustrative overview of the n8n automation: Webhook input, OpenAI script and publishing copy, content audit, Creatomate video render, and final video or job status. This is a conceptual process diagram, not a screenshot of the editor.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190a13"/><stop offset=".55" stop-color="#0a0a10"/><stop offset="1" stop-color="#180b12"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6a82"/><stop offset=".6" stop-color="#ff3156"/><stop offset="1" stop-color="#a81336"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#25141f"/><stop offset="1" stop-color="#101017"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#e21b4350"/><stop offset="1" stop-color="#ed124100"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity=".65"/></filter>
