</style></head><body><div id="store"></div><script id="store-data" type="application/json">__SUPERSTORE_USER_DATA__</script><script>(() => {

  function formMarkup(form){if(!form?.enabled)return '';return `<section class="lead-section wrap" data-form-section="${form.id}"><div>${sectionHeading('form-'+form.id,loc(form.title),loc(form.title))}<p>${esc(loc(form.description))}</p></div><form class="lead-form" data-lead-form="${form.id}">${form.fields.map(f=>`<label>${esc(loc(f.label)||f.id)}${f.required?' *':''}${f.type==='textarea'?`<textarea name="${f.id}" ${f.required?'required':''} maxlength="4000"></textarea>`:f.type==='select'?`<select name="${f.id}" ${f.required?'required':''}><option value="">${t('اختَر','Select')}</option>${loc(f.options).split('\n').filter(Boolean).map(v=>`<option>${esc(v)}</option>`).join('')}</select>`:`<input name="${f.id}" type="${f.type}" ${f.required?'required':''} maxlength="500" autocomplete="${f.type==='email'?'email':f.type==='tel'?'tel':'off'}">`}</label>`).join('')}<label class="trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="consent"><input type="checkbox" name="consent" required> <span>${esc(loc(form.consent)||t('أوافق على إرسال البيانات للمتجر.','I agree to share these details with the store.'))}</span></label><button class="button full" type="submit">${esc(loc(form.button)||t('إرسال','Submit'))}</button><p class="form-status small" role="status"></p>${original._preview?`<p class="small">${t('معاينة: الإرسال يسجل بيانات تجريبية داخل البرنامج.','Preview: submissions are saved as test leads in Studio.')}</p>`:''}</form></section>`;}

  }
  function productsSection(){return `<section class="products-section wrap" id="products"${edit('products')}>${sectionHeading('products','اكتشف المجموعة','Discover the collection')}<span id="results-count" class="section-number"></span><div class="filters"><label class="search"><span>⌕</span><input id="search" placeholder="${t('ابحث عن منتج…','Search products…')}" aria-label="${t('البحث عن منتج','Search products')}"></label><select id="category-filter" aria-label="${t('الفئة','Category')}"><option value="">${t('كل الفئات','All categories')}</option>${[...new Set(p.products.map(x=>x.category||t('عام','General')))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="sort" aria-label="${t('الترتيب','Sort')}"><option value="default">${t('الترتيب الافتراضي','Default order')}</option><option value="low">${t('السعر: الأقل أولًا','Price: low to high')}</option><option value="high">${t('السعر: الأعلى أولًا','Price: high to low')}</option><option value="name">${t('الاسم','Name')}</option></select></div><div class="filter-options"><label><input type="checkbox" id="stock-filter">${t('المتوفر فقط','In stock only')}</label><button id="clear-filters" class="plain">${t('مسح الفلاتر','Clear filters')}</button></div><div id="product-grid" class="product-grid"></div><div class="more-wrap"><button id="load-more" class="outline">${t('عرض المزيد','Load more')} ↓</button></div></section>`;}
  function render(){

    const selected=cfg.pages.find(x=>x.slug===page);if(page!=='home'&&!selected)page='home';
    const campaign=cfg.campaigns.find(active);
    root.innerHTML=`${p.announcement?`<div class="announcement"${edit('announcement')}>${esc(p.announcement)}</div>`:''}<header class="store-header"${edit('header')}><div class="wrap header-inner"><a class="store-brand" href="index.html" data-page="home">${p.logo?`<img src="${esc(p.logo)}" alt="${esc(p.name)}">`:'<span class="brand-mark">◈</span>'}<strong>${esc(p.name)}</strong></a><nav aria-label="${t('التنقل','Navigation')}"><a href="index.html" data-page="home">${label('home','الرئيسية','Home')}</a>${cfg.pages.filter(x=>x.nav).map(x=>`<a href="${x.slug}.html" data-page="${x.slug}">${esc(loc(x.title))}</a>`).join('')}${!cfg.pages.some(x=>x.nav)?`<a href="#products">${label('collection','المجموعة','Collection')}</a><a href="#contact">${label('contactNav','تواصل معنا','Contact')}</a>`:''}</nav><div class="header-buttons">${cfg.bilingual?`<button class="language-button" id="store-language">${lang==='ar'?'EN':'عربي'}</button>`:''}${cfg.wishlist!==false&&p.wishlist?`<button id="wishlist-toggle" class="round" aria-label="${t('عرض المفضلة','Show favorites')}">♡</button>`:''}<button id="cart-open" class="cart-button">${label('cart','السلة','Cart')} <span id="cart-count">${count()}</span></button></div></div></header>${campaign?`<div class="campaign-banner"><strong>${esc(loc(campaign.name))}</strong> ${esc(loc(campaign.text))} ${campaign.code?`<button data-coupon="${esc(campaign.code)}">${t('استخدم','Use')} ${esc(campaign.code)} · ${campaign.discount}%</button>`:''}${campaign.endsAt?`<span data-deadline="${esc(campaign.endsAt)}"></span>`:''}</div>`:''}<main>${selected?`<section class="page-title wrap"><h1>${esc(loc(selected.title))}</h1><p>${esc(loc(selected.description))}</p></section>${selected.blocks.map(blockMarkup).join('')}`:p.sections.filter(s=>s.enabled&&sections[s.id]).map(s=>sections[s.id]()).join('')+cfg.homeBlocks.map(blockMarkup).join('')+cfg.forms.filter(f=>f.home!==false&&!cfg.homeBlocks.some(b=>b.type==='form'&&b.formId===f.id)).map(formMarkup).join('')+(cfg.homeBlocks.some(b=>b.type==='game')?'':gameMarkup())}</main><footer class="store-footer wrap"${edit('footer')}><span>© ${new Date().getFullYear()} ${esc(p.name)}</span><span>${esc(loc(cfg.footerText)||p.tagline)}</span><a href="#home">${label('backTop','العودة للأعلى','Back to top')} ↑</a></footer><dialog id="shop-dialog"></dialog><div id="notification" role="status"></div>`;
    dialog=document.getElementById('shop-dialog');document.querySelector('.store-header').style.position=cfg.stickyHeader?'sticky':'relative';
    for(const [id,s] of Object.entries(cfg.sectionStyles)){const node=root.querySelector(`[data-edit-section="${id}"]`)||root.querySelector('.'+({hero:'hero',benefits:'benefits',categories:'category-section',products:'products-section',about:'about-section',faq:'faq-section',contact:'contact-section',announcement:'announcement',header:'store-header',footer:'store-footer'}[id]||'not-found'));if(node){if(s.background)node.style.background=s.background;if(s.color){node.style.color=s.color;node.style.setProperty('--ink',s.color);node.style.setProperty('--muted',s.color);}node.style.paddingBlock=s.padding+'px';node.style.textAlign=s.align;}}
    renderProducts();persist();updateClocks();
    document.getElementById('search')?.addEventListener('input',e=>{query=e.target.value.trim();visible=12;renderProducts();});
    document.getElementById('category-filter')?.addEventListener('change',e=>{category=e.target.value;visible=12;renderProducts();});
    document.getElementById('sort')?.addEventListener('change',e=>{sort=e.target.value;renderProducts();});
    document.getElementById('stock-filter')?.addEventListener('change',e=>{onlyStock=e.target.checked;visible=12;renderProducts();});
  }
  function productCard(x){return `<article class="product-card"><div class="product-picture">${image(x.images[0],x.name)}${x.discount?`<span class="discount">${t('خصم','Save')} ${x.discount}%</span>`:''}${!x.quantity?`<span class="unavailable">${t('نفد المخزون','Out of stock')}</span>`:''}${p.wishlist?`<button class="favorite ${wishlist.includes(x.id)?'selected':''}" data-favorite="${x.id}" aria-label="${t('حفظ','Save')} ${esc(x.name)}" aria-pressed="${wishlist.includes(x.id)}">${wishlist.includes(x.id)?'♥':'♡'}</button>`:''}${p.quickview?`<button class="quickview" data-view="${x.id}">${label('quickview','نظرة أقرب','Quick view')} ↗</button>`:''}</div><div class="product-meta"><span>${esc(x.category)}</span>${x.featured?`<small>${t('مختار لك','Selected for you')}</small>`:''}</div><h3>${esc(x.name)}</h3><div class="price-row"><div><b>${esc(money(price(x)))}</b>${x.discount?`<del>${esc(money(x.price))}</del>`:''}</div><button class="add-button" data-add="${x.id}" ${!x.quantity?'disabled':''} aria-label="${t('إضافة للسلة','Add to cart')}">＋</button></div></article>`;}
  function renderProducts(){const grid=document.getElementById('product-grid');if(!grid)return;const normalize=x=>x.toLowerCase().normalize('NFKD').replace(/[\u064b-\u065f]/g,'');let result=p.products.filter(x=>(!query||normalize(x.name+' '+x.description+' '+x.sku).includes(normalize(query)))&&(!category||(x.category||t('عام','General'))===category)&&(!onlyFavorites||wishlist.includes(x.id))&&(!onlyStock||x.quantity>0));if(sort==='low')result.sort((a,b)=>price(a)-price(b));if(sort==='high')result.sort((a,b)=>price(b)-price(a));if(sort==='name')result.sort((a,b)=>a.name.localeCompare(b.name,lang));document.getElementById('results-count').textContent=result.length+' '+t('منتج','products')+(onlyFavorites?' · '+t('المفضلة','Favorites'):'');grid.innerHTML=result.length?result.slice(0,visible).map(productCard).join(''):`<div class="no-results">${t('لا توجد منتجات مطابقة.','No matching products.')}</div>`;document.getElementById('load-more').hidden=result.length<=visible;}
  function add(id){const item=p.products.find(x=>x.id===id);if(!item)return;if((cart[id]||0)>=item.quantity)return notify(t('وصلت إلى الكمية المتاحة','You reached the available quantity'));cart[id]=(cart[id]||0)+1;persist();notify(t('أُضيف المنتج إلى السلة','Added to your cart'));}
  function showModal(html){dialog.innerHTML=`<button class="dialog-close" data-close aria-label="${t('إغلاق','Close')}">×</button>${html}`;if(!dialog.open)dialog.showModal();}
  function view(id){const x=p.products.find(x=>x.id===id);if(!x)return;showModal(`<div class="detail-layout"><div><div id="detail-image">${image(x.images[0],x.name)}</div><div class="detail-gallery">${x.images.map((src,i)=>`<button data-gallery="${i}" data-item="${x.id}" aria-label="${t('صورة','Image')} ${i+1}">${image(src,x.name)}</button>`).join('')}</div></div><div><span class="eyebrow">${esc(x.category)}</span><h2>${esc(x.name)}</h2><p class="detail-description">${esc(x.description).replace(/\n/g,'<br>')}</p><p class="small">${esc(x.sku)}</p><h3>${esc(money(price(x)))}</h3><p class="small">${x.quantity?t('متوفر للطلب','Available to order'):t('غير متوفر','Out of stock')}</p><button class="button" data-add="${x.id}" ${!x.quantity?'disabled':''}>${t('أضف للسلة','Add to cart')} ＋</button></div></div>`);}
  function couponRate(){const campaign=cfg.campaigns.find(c=>c.code&&c.code===coupon&&active(c));if(campaign)return campaign.discount;if(active(cfg.game)&&coupon===cfg.game.code&&storage.get(key+':gameWon','')===(cfg.game.code+'|'+cfg.game.endsAt))return cfg.game.discount;return 0;}
  function totals(){const subtotal=Object.entries(cart).reduce((sum,[id,q])=>sum+price(p.products.find(x=>x.id===id))*q,0);const discount=Math.round(subtotal*couponRate())/100;const after=subtotal-discount;const shipping=!count()||p.freeShipping>0&&after>=p.freeShipping?0:p.shipping;return {subtotal,discount,shipping,total:Math.round((after+shipping)*100)/100};}
  function showCart(){const sum=totals();showModal(`<h2>${t('سلتك','Your cart')} <span class="small">${count()} ${t('قطعة','items')}</span></h2>${count()?`<div class="cart-items">${Object.entries(cart).map(([id,q])=>{const x=p.products.find(x=>x.id===id);return `<div class="cart-item">${image(x.images[0],x.name)}<div><strong>${esc(x.name)}</strong><span>${esc(money(price(x)))}</span><div class="quantity"><button data-quantity="${id}" data-delta="-1" aria-label="${t('تقليل الكمية','Decrease quantity')}">−</button><b>${q}</b><button data-quantity="${id}" data-delta="1" aria-label="${t('زيادة الكمية','Increase quantity')}">＋</button><button data-remove="${id}" class="remove">${t('حذف','Remove')}</button></div></div><b>${esc(money(price(x)*q))}</b></div>`;}).join('')}</div><div class="coupon-entry"><input id="coupon-input" placeholder="${t('كود الخصم','Discount code')}" value="${esc(coupon)}"><button class="outline" id="apply-coupon">${t('تطبيق','Apply')}</button></div><div class="totals"><p><span>${t('المنتجات','Subtotal')}</span><b>${esc(money(sum.subtotal))}</b></p>${sum.discount?`<p><span>${t('خصم الكوبون','Coupon discount')}</span><b>− ${esc(money(sum.discount))}</b></p>`:''}<p><span>${t('الشحن','Shipping')}</span><b>${esc(money(sum.shipping))}</b></p><p class="grand-total"><span>${t('الإجمالي','Total')}</span><b>${esc(money(sum.total))}</b></p></div><button id="checkout" class="button full" ${/^\d{8,15}$/.test(p.phone.replace(/\D/g,''))?'':'disabled'}>${t('إرسال طلب عبر واتساب','Order via WhatsApp')} ↗</button>${!p.phone?`<p class="small">${t('رقم الطلبات لم يُضف بعد.','The store has not added an order number yet.')}</p>`:''}`:`<div class="no-results">${t('سلتك فارغة.','Your cart is empty.')}</div>`}`);}
  const utm=Object.fromEntries(['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].map(k=>[k,new URLSearchParams(location.search).get(k)||'']));
  const pending=new Map();
  window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='studio:collected')return;const item=pending.get(event.data.requestId);if(item){clearTimeout(item.timer);pending.delete(event.data.requestId);event.data.ok?item.resolve(event.data):item.reject(new Error(event.data.error||'Collection failed'));}});
  async function collect(formId,values,consent,submissionId){const payload={projectId:p.id,formId,values,consent,submissionId,page,utm,website:values.website||''};if(original._preview&&parent!==window){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(submissionId);reject(new Error('Preview connection timed out'));},15000);pending.set(submissionId,{resolve,reject,timer});parent.postMessage({type:'studio:collect',requestId:submissionId,payload},'*');});}
    if(location.protocol==='file:'&&!cfg.collectorEndpoint)throw new Error(t('افتح الصفحة من خادم استقبال البيانات، وليس كملف محلي.','Open this page through the collection server, not as a local file.'));
    const endpoint=cfg.collectorEndpoint||new URL('./api/collect',location.href).href;
    const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(15000)});let data;try{data=await response.json();}catch{throw new Error(t('وجهة الاستقبال غير مهيأة.','The collection endpoint is not configured.'));}if(!response.ok||data.ok!==true)throw new Error(t('لم يتم تسجيل البيانات. راجع الحقول والاتصال ثم حاول مجددًا.','Details were not saved. Check the fields and connection, then retry.'));return data;
  }
  function uid(){return crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');}
  function checkout(){showModal(`<h2>${t('تفاصيل طلبك','Order details')}</h2><p class="small">${t('سنجهّز رسالة واتساب لتراجعها وترسلها بنفسك.','We will prepare a WhatsApp message for you to review and send.')}</p><form id="checkout-form"><label>${t('الاسم','Name')}<input name="name" required maxlength="100" autocomplete="name"></label><label>${t('رقم الموبايل','Phone')}<input name="phone" type="tel" required maxlength="25" autocomplete="tel"></label><label>${t('العنوان بالتفصيل','Delivery address')}<textarea name="address" required maxlength="500" autocomplete="street-address"></textarea></label><label>${t('ملاحظات إضافية','Notes')}<textarea name="notes" maxlength="500"></textarea></label><label class="consent"><input type="checkbox" name="consent"><span>${t('أوافق على حفظ بيانات طلبي لدى المتجر للتواصل معي.','I agree to let the store save these order details to contact me.')}</span></label><p class="small">${t('تأكيد السعر والشحن والتوفر يتم مع البائع.','The seller confirms final prices, shipping and availability.')}</p><button type="submit" class="button full">${t('متابعة إلى واتساب','Continue to WhatsApp')} · ${esc(money(totals().total))}</button><p class="form-status small" role="status"></p><a id="order-link" class="button full" target="_blank" rel="noopener" hidden></a></form>`);}
  root.addEventListener('submit',async event=>{event.preventDefault();const form=event.target;if(!form.matches('.lead-form,#checkout-form'))return;const data=new FormData(form),values=Object.fromEntries([...data].filter(([k])=>k!=='consent'));const status=form.querySelector('.form-status'),button=form.querySelector('[type=submit]');const submissionId=form.dataset.submissionId||(form.dataset.submissionId=uid());
    if(form.id==='checkout-form'){
      if(!String(values.name).trim()||!String(values.address).trim()||!/^\d{7,15}$/.test(String(values.phone).replace(/\D/g,'')))return notify(t('أدخل الاسم والعنوان ورقمًا صحيحًا.','Enter a name, address and valid phone.'));
      const sum=totals(),lines=[t('طلب جديد من ','New order from ')+p.name,...Object.entries(cart).map(([id,q])=>{const x=p.products.find(x=>x.id===id);return `${x.name}${x.sku?' ['+x.sku+']':''} × ${q} — ${money(price(x)*q)}`;}),t('المنتجات: ','Subtotal: ')+money(sum.subtotal),t('خصم: ','Discount: ')+money(sum.discount)+(sum.discount?' ('+coupon+')':''),t('الشحن: ','Shipping: ')+money(sum.shipping),t('الإجمالي: ','Total: ')+money(sum.total),t('الاسم: ','Name: ')+values.name,t('الموبايل: ','Phone: ')+values.phone,t('العنوان: ','Address: ')+values.address,t('ملاحظات: ','Notes: ')+(values.notes||'-')];
      const url='https://wa.me/'+p.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(lines.join('\n'));
      if(!data.has('consent')){window.open(url,'_blank','noopener');return;}
      button.disabled=true;status.textContent=t('جارٍ حفظ بيانات الطلب…','Saving order details…');try{await collect('checkout',{...values,order:lines.join('\n')},true,submissionId);status.textContent=t('تم الحفظ. اضغط لفتح واتساب وإرسال الطلب.','Saved. Open WhatsApp below to send your order.');const a=form.querySelector('#order-link');a.href=url;a.textContent=t('افتح واتساب وأرسل الطلب','Open WhatsApp and send');a.hidden=false;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}return;
    }
    button.disabled=true;status.textContent=t('جارٍ الإرسال…','Sending…');try{await collect(form.dataset.leadForm,values,data.has('consent'),submissionId);const config=cfg.forms.find(f=>f.id===form.dataset.leadForm);status.textContent=loc(config.success);form.reset();delete form.dataset.submissionId;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}
  });
  function startGame(){if(!active(cfg.game))return;const cards=['◇','◆','○','◇','◆','○'];for(let i=cards.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[cards[i],cards[j]]=[cards[j],cards[i]];}game={cards,open:[],matched:[],moves:0,locked:false};document.getElementById('game-start').textContent=t('ابدأ من جديد','Restart');document.getElementById('game-result').textContent='';renderGame();}
  function renderGame(){if(!game)return;document.getElementById('game-board').innerHTML=`<div class="memory-grid">${game.cards.map((v,i)=>`<button class="memory-card ${game.matched.includes(i)?'matched':''}" data-memory="${i}" ${game.matched.includes(i)?'disabled':''} aria-label="${t('بطاقة','Card')} ${i+1}">${game.open.includes(i)||game.matched.includes(i)?v:'?'}</button>`).join('')}</div><p>${t('المحاولات','Moves')}: ${game.moves} / ${cfg.game.attempts}</p>`;}
  function flip(i){if(!game||game.locked||game.open.includes(i)||game.matched.includes(i)||!active(cfg.game))return;game.open.push(i);renderGame();if(game.open.length<2)return;game.moves++;const [a,b]=game.open;if(game.cards[a]===game.cards[b]){game.matched.push(a,b);game.open=[];renderGame();if(game.matched.length===6){storage.set(key+':gameWon',cfg.game.code+'|'+cfg.game.endsAt);document.getElementById('game-result').innerHTML=`<h3>${t('كسبت! كود خصمك','You won! Your code')}: ${esc(cfg.game.code)}</h3><button class="button" data-coupon="${esc(cfg.game.code)}">${t('تفعيل خصم','Apply discount')} ${cfg.game.discount}%</button>`;game.locked=true;return;}}
    if(game.moves>=cfg.game.attempts){game.locked=true;document.getElementById('game-result').textContent=t('انتهت المحاولات. جرّب مرة أخرى.','No moves left. Try again.');return;}
    if(game.open.length){game.locked=true;const current=game;setTimeout(()=>{if(game!==current)return;game.open=[];game.locked=false;renderGame();},650);}
  }
  function applyCoupon(value){coupon=value.trim().toUpperCase();persist();if(!couponRate()){coupon='';persist();notify(t('الكود غير صالح أو انتهى العرض.','Invalid code or the offer has ended.'));}else notify(t('تم تفعيل الخصم','Discount applied'));}
  root.addEventListener('click',event=>{const target=event.target.closest('button,a');if(!target)return;
    if(target.dataset.page){event.preventDefault();page=target.dataset.page;query='';category='';if(!original._preview){try{const next=new URL((page==='home'?'index':page)+'.html',location.href);next.search=location.search;history.pushState({page},'',next);}catch{}}render();window.scrollTo(0,0);if(original._preview)parent.postMessage({type:'studio:page',page},'*');return;}
    if(target.hasAttribute('data-close'))dialog.close();if(target.dataset.add)add(target.dataset.add);if(target.dataset.view)view(target.dataset.view);
    if(target.dataset.favorite){const id=target.dataset.favorite;wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];persist();renderProducts();}
    if(target.dataset.gallery!==undefined){const x=p.products.find(x=>x.id===target.dataset.item);document.getElementById('detail-image').innerHTML=image(x.images[Number(target.dataset.gallery)],x.name);}
    if(target.dataset.quantity){const x=p.products.find(x=>x.id===target.dataset.quantity),next=cart[x.id]+Number(target.dataset.delta);if(next>x.quantity)return notify(t('وصلت إلى الكمية المتاحة','You reached the available quantity'));if(next<=0)delete cart[x.id];else cart[x.id]=next;persist();showCart();}
    if(target.dataset.remove){delete cart[target.dataset.remove];persist();showCart();}
    if(target.dataset.coupon){applyCoupon(target.dataset.coupon);if(dialog.open)showCart();}
    if(target.dataset.memory!==undefined)flip(Number(target.dataset.memory));
    if(target.dataset.category!==undefined){category=target.dataset.category;visible=12;const select=document.getElementById('category-filter');if(select)select.value=category;renderProducts();document.getElementById('products')?.scrollIntoView({behavior:'smooth'});}
    switch(target.id){case 'store-language':lang=lang==='ar'?'en':'ar';category='';query='';render();break;case 'cart-open':showCart();break;case 'checkout':checkout();break;case 'load-more':visible+=12;renderProducts();break;case 'wishlist-toggle':onlyFavorites=!onlyFavorites;target.classList.toggle('selected',onlyFavorites);visible=12;renderProducts();document.getElementById('products')?.scrollIntoView({behavior:'smooth'});break;case 'game-start':startGame();break;case 'apply-coupon':applyCoupon(document.getElementById('coupon-input').value);showCart();break;case 'clear-filters':query='';category='';sort='default';onlyStock=false;onlyFavorites=false;visible=12;document.getElementById('search').value='';document.getElementById('category-filter').value='';document.getElementById('sort').value='default';document.getElementById('stock-filter').checked=false;document.getElementById('wishlist-toggle')?.classList.remove('selected');renderProducts();break;}
  });
  root.addEventListener('dblclick',e=>{const node=e.target.closest('[data-edit-section]');if(original._preview&&node)parent.postMessage({type:'studio:edit',section:node.dataset.editSection,page},'*');});
  function updateClocks(){root.querySelectorAll('[data-deadline]').forEach(node=>{const diff=new Date(node.dataset.deadline).getTime()-Date.now();if(!Number.isFinite(diff)){node.textContent='';return;}if(diff<=0){node.textContent=t('انتهى العرض','Offer ended');return;}const hours=Math.floor(diff/3600000),mins=Math.floor(diff%3600000/60000),secs=Math.floor(diff%60000/1000);node.textContent=`${hours}h : ${String(mins).padStart(2,'0')}m : ${String(secs).padStart(2,'0')}s`;});}
  window.addEventListener('popstate',()=>{page=history.state?.page||original._page||'home';render();});
  render();setInterval(updateClocks,1000);
})();
</script></body></html>
